name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  # Allows manual trigger from Actions tab
  workflow_dispatch:

# Sets permissions for GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Lifted to the job so the source-map step can test it in an `if:` — the
    # `secrets` context is not available there, but `env` is.
    env:
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      # The public half of the VAPID pair, for trip reminders. Lifted here for
      # the same reason: the step below warns when it is missing.
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (for sharp in generate-icons)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate icons
        run: bun run generate-icons

      # A missing key is not a failure — the app ships and simply never offers
      # reminders, and every phone sees the install nudge instead. It is
      # silent, though, and the VITE_SHARE_ORIGIN note below records what
      # silent cost the last time a deploy went out without one of these.
      - name: Warn when trip reminders are unconfigured
        if: ${{ env.VAPID_PUBLIC_KEY == '' }}
        run: |
          echo "::warning title=No trip reminders::VAPID_PUBLIC_KEY is unset, so this build ships without Web Push reminders. Generate a pair with scripts/generate-vapid-keys.mjs and add the public half as a repository secret."

      - name: Build
        run: bun run build
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}@${{ github.sha }}
          # Secret names keep their NEXT_PUBLIC_ prefix in GitHub; Vite only
          # exposes VITE_* to import.meta.env, so map them here rather than
          # renaming the secrets.
          VITE_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          # The repository secrets are named NEXT_PUBLIC_*; Vite only inlines
          # VITE_-prefixed variables into import.meta.env, so they are mapped
          # here. Rename the secrets and both sides if that ever gets confusing.
          # Absent values are not fatal: src/lib/posthog.ts leaves the client
          # undefined and every capture becomes a no-op.
          VITE_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          # The link preview service, server/share-preview. With it set, the
          # share dialog hands out https://share.kikouchou.app/<lang>/<token>,
          # which shows that trip's own name, dates and occupancy when the link
          # is pasted into a chat. Without it the dialog hands out the direct
          # /join/<token> link and every share shows the generic card.
          #
          # A literal, not a secret: it is a hostname, it is in the built bundle
          # by design, and a missing secret would fail silently back to the old
          # link — which is exactly what happened on the first deploy of this.
          VITE_SHARE_ORIGIN: https://share.kikouchou.app
          # Trip reminders over Web Push. The public half of the VAPID pair —
          # public by design: every browser sends it to its push service and it
          # ships in the bundle. The private half is the one that matters, and
          # it lives only on the VPS as VAPID_PRIVATE_KEY, never here.
          #
          # Unset, `isPushSupported()` is false: the reminder card never
          # renders and the calendar offers the install nudge instead. Nothing
          # breaks, so the step above says so out loud.
          VITE_VAPID_PUBLIC_KEY: ${{ env.VAPID_PUBLIC_KEY }}
          # The OAuth client IDs of the two sign-in providers. Public halves:
          # a client ID travels in every authorize redirect. The matching
          # secrets are deliberately absent here — the hosted Supabase project
          # holds the only copy of each, and nothing in CI may write one.
          #
          # No VITE_ prefix, so Vite does not inline them and the bundle is
          # unchanged: `bun run build` simply sees them in its environment.
          # They are here for `supabase/config.toml`, whose `[auth.external.*]`
          # blocks reference these exact names, so a step that resolves those
          # references finds them already set. Rename them and that link
          # breaks.
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
          SUPABASE_AUTH_EXTERNAL_SPOTIFY_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_SPOTIFY_CLIENT_ID }}

      # Rewrites the built bundles in place to carry a chunk ID, then uploads
      # the .map files to PostHog and deletes them. It must run between the
      # build and the Pages upload: the *injected* bundles are what has to ship,
      # because PostHog matches a stack trace to its map by that chunk ID.
      - name: Upload source maps to PostHog
        if: ${{ env.POSTHOG_CLI_API_KEY != '' }}
        uses: PostHog/upload-source-maps@v2
        with:
          directory: dist
          api-key: ${{ env.POSTHOG_CLI_API_KEY }}
          project-id: '263292'
          # This project lives on EU cloud; the input wants the app host, not
          # the ingestion host that VITE_POSTHOG_HOST points at.
          host: https://eu.posthog.com
          release-version: ${{ github.sha }}
          delete-after-upload: 'true'

      # Safety net: source maps must never reach GitHub Pages, which serves the
      # artifact publicly. delete-after-upload already removes them, but this
      # also covers the path where the step above was skipped for a missing key.
      - name: Strip any remaining source maps
        run: find dist -name '*.map' -type f -print -delete

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
