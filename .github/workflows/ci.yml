name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  # Allows manual trigger from Actions tab
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Generate Check - Verify generated code is up to date
  # ============================================================================
  generate-check:
    name: Generate Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run code generation
        run: bun run generate-proto

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code -- src/gen/; then
            echo "::error::Generated code is out of date. Run 'bun run generate-proto' and commit the changes."
            exit 1
          fi

  # ============================================================================
  # Lint - Check code style and quality
  # ============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

  # ============================================================================
  # Type Check - Verify TypeScript types
  # ============================================================================
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `tsc --noEmit` resolves ZERO files here: the root tsconfig.json is a
      # solution file (`"files": []` + `references`), and references are only
      # honoured in --build mode. `tsc -b` is the only form that type-checks.
      - name: Run TypeScript compiler
        run: bunx tsc -b --force

  # ============================================================================
  # Unit Tests - Run Vitest unit tests
  # ============================================================================
  # ============================================================================
  # Database Tests - RLS policies and invite lifecycle against a real Postgres
  # ============================================================================
  db-test:
    name: Database Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # RLS is the only thing protecting this data — the publishable key ships
      # inside the client bundle. Policies that nobody exercises rot silently,
      # and the failure mode is a data leak rather than a red build, so these
      # run on every push.
      - name: Start Supabase
        run: bunx supabase start

      - name: Run pgTAP tests
        run: bunx supabase test db

      - name: Stop Supabase
        if: always()
        run: bunx supabase stop --no-backup

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test:run

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ============================================================================
  # Generate Icons - Generate PWA icons
  # ============================================================================
  generate-icons:
    name: Generate Icons
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (for sharp)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate icons
        run: bun run generate-icons

      - name: Upload generated icons
        uses: actions/upload-artifact@v4
        with:
          name: generated-icons
          path: public/icons/
          retention-days: 1

  # ============================================================================
  # Build - Build production bundle
  # ============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [generate-icons]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download generated icons
        uses: actions/download-artifact@v4
        with:
          name: generated-icons
          path: public/icons/

      - name: Build
        run: bun run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_SIGNALING_URL: wss://kikoushou.cyprin.eu

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/
          retention-days: 7

  # ============================================================================
  # E2E Tests - Run Playwright end-to-end tests
  # ============================================================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: dist/

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

