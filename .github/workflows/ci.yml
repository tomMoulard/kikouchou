name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  # Allows manual trigger from Actions tab
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Generate Check - Verify generated code is up to date
  # ============================================================================
  generate-check:
    name: Generate Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run code generation
        run: bun run generate-proto

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code -- src/gen/; then
            echo "::error::Generated code is out of date. Run 'bun run generate-proto' and commit the changes."
            exit 1
          fi

  # ============================================================================
  # Lint - Check code style and quality
  # ============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

  # ============================================================================
  # Type Check - Verify TypeScript types
  # ============================================================================
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `tsc --noEmit` resolves ZERO files here: the root tsconfig.json is a
      # solution file (`"files": []` + `references`), and references are only
      # honoured in --build mode. `tsc -b` is the only form that type-checks.
      - name: Run TypeScript compiler
        run: bunx tsc -b --force

  # ============================================================================
  # Database Tests - RLS policies and invite lifecycle against a real Postgres
  # ============================================================================
  db-test:
    name: Database Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # RLS is the only thing protecting this data — the publishable key ships
      # inside the client bundle. Policies that nobody exercises rot silently,
      # and the failure mode is a data leak rather than a red build, so these
      # run on every push.
      - name: Start Supabase
        run: bunx supabase start

      - name: Run pgTAP tests
        run: bunx supabase test db

      - name: Stop Supabase
        if: always()
        run: bunx supabase stop --no-backup

  # ============================================================================
  # Unit Tests - Run Vitest unit tests, with coverage thresholds enforced
  # ============================================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    # Coverage instrumentation makes this job roughly 4x slower than the bare
    # run it replaced (203s vs 54s measured locally), so it is worth bounding.
    # GitHub's default is 360 minutes: a suite that hangs would burn six hours
    # of runner time before anyone saw a red mark. 30 leaves ~3x headroom over
    # the measured time and still fails fast. Raise it if the suite legitimately
    # grows into it — do not let it sit just above the real duration, which is
    # how the E2E job ended up killed on every run for months.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `test:coverage`, not `test:run`. `vitest.config.ts` has declared
      # coverage thresholds since it was written, but nothing ever passed
      # `--coverage`: `test:run` is a bare `vitest run`, `validate` calls
      # `test:run`, and `test:coverage` was invoked by nothing at all. The
      # thresholds gated nothing, and the first run that actually measured them
      # found branches at 75.35% against a declared 79% — a gate that had been
      # red the whole time without anyone being able to see it.
      #
      # The upload step below was the visible symptom: it asks for `coverage/`,
      # which `test:run` never writes, so it warned "No files were found with
      # the provided path" on every run since it was added and uploaded an empty
      # artifact.
      - name: Run unit tests with coverage
        run: bun run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ============================================================================
  # Generate Icons - Generate PWA icons
  # ============================================================================
  generate-icons:
    name: Generate Icons
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (for sharp)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate icons
        run: bun run generate-icons

      - name: Upload generated icons
        uses: actions/upload-artifact@v4
        with:
          name: generated-icons
          path: public/icons/
          retention-days: 1

  # ============================================================================
  # Build - Build production bundle
  # ============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [generate-icons]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download generated icons
        uses: actions/download-artifact@v4
        with:
          name: generated-icons
          path: public/icons/

      - name: Build
        run: bun run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/
          retention-days: 7

  # ============================================================================
  # E2E Tests - Run Playwright end-to-end tests
  # ============================================================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # 30 was not enough and the job was killed at that mark on every single run
    # since this workflow was written, which reads as a failure and hid whatever
    # the suite was actually saying. A green run of all 214 tests takes ~13 min
    # on a developer laptop at CI's `workers: 1`, and a GitHub runner is
    # slower — so this leaves real headroom rather than sitting just above the
    # measured time.
    timeout-minutes: 45
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No build artifact is downloaded here on purpose: the `production`
      # Playwright project runs `bun run build` itself, because it also has to
      # blank the Supabase and PostHog variables that would otherwise be inlined
      # into the bundle it serves. Downloading the artifact only ever cost time.
      #
      # `needs: [build]` stays, so a broken build still fails before this runs.

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

