<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` lets the layout viewport run under the notch and the
      home indicator, which is what makes an installed PWA look installed rather
      than letterboxed in `theme-color`. It is also what makes
      `env(safe-area-inset-*)` report anything but 0 — without it those values
      are always zero and every safe-area rule is dead code. The two go
      together: see the "mobile bottom edge" block in `src/index.css` for the
      stack that reads them.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kikouchou</title>

    <!-- PWA Meta Tags -->
    <meta name="description" content="Organize your vacation house rooms and arrivals" />
    <meta name="theme-color" content="#0f172a" />

    <!--
      Link preview (Open Graph + Twitter).

      These sit in the static HTML on purpose. A link crawler does not run
      JavaScript, so a tag that React sets is invisible to it: whatever is in
      this file is the whole preview, for every URL in the app.

      That is also why every value here is generic. This one card answers the
      root page and, because `vite.config.ts` copies `index.html` to `404.html`,
      every client-routed path as well — a `/join/<token>` invite included, which
      GitHub Pages serves from that same fallback. A crawler reaching this file
      cannot be told which trip a share link points at.

      A trip's own name, dates and occupancy come from somewhere else entirely:
      `server/share-preview`, answering on share.kikouchou.app, which renders
      those tags per invite and then redirects here. A build with
      `VITE_SHARE_ORIGIN` set hands out that link; one without hands out
      `/join/<token>` and gets the generic card below. Both work.

      `og:image` must be absolute — a relative path is silently dropped by most
      crawlers — so the domain is written out rather than derived. The file is
      generated from `public/og-card.svg` by `bun run generate-icons`, which CI
      runs before the build.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kikouchou" />
    <meta property="og:title" content="Kikouchou — who sleeps where, and who picks up whom" />
    <meta
      property="og:description"
      content="Plan a house full of friends: room assignments, arrivals and departures, on one shared calendar."
    />
    <meta property="og:url" content="https://app.kikouchou.app/" />
    <meta property="og:image" content="https://app.kikouchou.app/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="An example trip timeline: six guests down the left, seven days across, and a colored bar naming the room each one sleeps in."
    />
    <meta property="og:locale" content="en" />

    <!-- Twitter reads its own names, and falls back to og: for anything absent.
         `summary_large_image` is what renders the 1200x630 card rather than a
         cropped thumbnail. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kikouchou — who sleeps where, and who picks up whom" />
    <meta
      name="twitter:description"
      content="Plan a house full of friends: room assignments, arrivals and departures, on one shared calendar."
    />
    <meta name="twitter:image" content="https://app.kikouchou.app/og-card.png" />

    <link rel="canonical" href="https://app.kikouchou.app/" />

    <!-- Apple PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kikouchou" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
