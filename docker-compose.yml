services:
  traefik:
    image: traefik:v3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=admin@kikoushou.app
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  relay:
    build:
      context: ./relay
      platforms:
        - linux/amd64
        - linux/arm64
    image: tommoulard/kikoushou-relay:latest
    ports:
      - "4444:4444"
    expose:
      - "4444"
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.relay.rule=Host(`signaling.kikoushou.app`)
      - traefik.http.routers.relay.entrypoints=websecure
      - traefik.http.routers.relay.tls.certresolver=letsencrypt
      - traefik.http.services.relay.loadbalancer.server.port=4444
      - traefik.http.middlewares.relay-ws.headers.customrequestheaders.Connection=Upgrade
      - traefik.http.middlewares.relay-ws.headers.customrequestheaders.Upgrade=websocket
      - traefik.http.routers.relay.middlewares=relay-ws

  app:
    build: .
    expose:
      - "3000"
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`kikoushou.app`)
      - traefik.http.routers.app.entrypoints=websecure
      - traefik.http.routers.app.tls.certresolver=letsencrypt
      - traefik.http.services.app.loadbalancer.server.port=3000

volumes:
  letsencrypt:
