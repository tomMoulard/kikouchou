[package]
name = "kikouchou-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Serves api.kikouchou.app, the app's API. Today: the assistant's chat, for a signed-in account."
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# Verifies the Supabase access token (ES256, keys from the project's JWKS).
jsonwebtoken = "9"
# `stream`: the answer is relayed to the browser as it arrives.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
