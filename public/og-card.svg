<!--
  Kikouchou link preview card - source for public/og-card.png

  This is what a pasted link to the app looks like in a chat window. It is the
  hero banner of www.kikouchou.app redrawn at the 1200x630 that every consumer
  of `og:image` is built around: Facebook, Slack, LinkedIn and iMessage all
  render a 1.91:1 card, and Twitter's `summary_large_image` crops to it.

  It follows the landing page rather than inventing a second look, down to the
  tokens: white surface, slate text, teal accent, the six `pN-label` guest
  colours from its palette, and the glow and 64px grid behind the header.
  Someone who saw the site recognises the card.

  Rows are guests, columns are the seven days of the trip, and each bar is the
  room that guest sleeps in. The trip name, the guest names and the train are
  the landing page mockup's, verbatim: Summer house, Aurélia, Tom, Alice +
  Julie, Guillaume, Clémentine, Hippolyte. They are illustrative, and they must
  stay that way. A card served from the root page cannot know a trip, and it
  must not carry a real one: every link scanner that sees the URL fetches the
  card, and chat apps cache it. Real per-trip cards are a separate, deferred
  piece of work (see TODO.md).

  Fonts: the stack starts with DejaVu Sans because this file is rasterised by
  sharp on an Ubuntu runner, where DejaVu is present and `system-ui` resolves to
  nothing. Anything missing falls through to the generic sans-serif rather than
  rendering blank. Every string sits at a hand-measured coordinate, so a font
  substitution changes glyph widths and never the layout.

  Regenerate with `bun run generate-icons`.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     font-family="DejaVu Sans, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <!-- The hero's two blurred blobs, teal and indigo. -->
    <radialGradient id="glowTeal" gradientUnits="userSpaceOnUse" cx="264" cy="76" r="520">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" gradientUnits="userSpaceOnUse" cx="984" cy="24" r="480">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <!-- Applied to its own rect, never to the window, so a rasteriser without
         filter support loses the shadow and nothing else. -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="1200" height="630" fill="url(#glowTeal)"/>
  <rect width="1200" height="630" fill="url(#glowIndigo)"/>

  <!-- 64px grid, header only, the way the hero masks it out further down. -->
  <g stroke="#0f172a" stroke-opacity="0.05" stroke-width="1">
    <line x1="64" y1="0" x2="64" y2="256"/>
    <line x1="128" y1="0" x2="128" y2="256"/>
    <line x1="192" y1="0" x2="192" y2="256"/>
    <line x1="256" y1="0" x2="256" y2="256"/>
    <line x1="320" y1="0" x2="320" y2="256"/>
    <line x1="384" y1="0" x2="384" y2="256"/>
    <line x1="448" y1="0" x2="448" y2="256"/>
    <line x1="512" y1="0" x2="512" y2="256"/>
    <line x1="576" y1="0" x2="576" y2="256"/>
    <line x1="640" y1="0" x2="640" y2="256"/>
    <line x1="704" y1="0" x2="704" y2="256"/>
    <line x1="768" y1="0" x2="768" y2="256"/>
    <line x1="832" y1="0" x2="832" y2="256"/>
    <line x1="896" y1="0" x2="896" y2="256"/>
    <line x1="960" y1="0" x2="960" y2="256"/>
    <line x1="1024" y1="0" x2="1024" y2="256"/>
    <line x1="1088" y1="0" x2="1088" y2="256"/>
    <line x1="1152" y1="0" x2="1152" y2="256"/>
    <line x1="0" y1="64" x2="1200" y2="64"/>
    <line x1="0" y1="128" x2="1200" y2="128"/>
    <line x1="0" y1="192" x2="1200" y2="192"/>
  </g>

  <!-- Header: wordmark, the hero headline, and where the card came from. -->
  <text x="56" y="62" fill="#0f172a" font-size="34" font-weight="700">Kikouchou</text>
  <text x="1144" y="62" fill="#0f766e" font-size="22" font-weight="600" text-anchor="end">app.kikouchou.app</text>
  <!-- `dx` rather than a trailing space: a rasteriser collapses the space at a
       tspan boundary and the two clauses run together. -->
  <text x="56" y="104" font-size="28"><tspan fill="#55637a">Who sleeps where, and</tspan><tspan dx="9" fill="#0f766e" font-weight="700">who picks up whom.</tspan></text>

  <!-- The app window, as the hero shows it. -->
  <rect x="76" y="158" width="1048" height="448" rx="24" fill="#0f172a" fill-opacity="0.16" filter="url(#cardShadow)"/>
  <rect x="56" y="136" width="1088" height="458" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title bar. The second rect squares off the bottom corners the first one
       rounded, so only the top of the window is round. -->
  <rect x="57" y="137" width="1086" height="51" rx="19" fill="#f8fafc"/>
  <rect x="57" y="166" width="1086" height="22" fill="#f8fafc"/>
  <line x1="56" y1="188" x2="1144" y2="188" stroke="#e2e8f0" stroke-width="1"/>
  <g fill="#cbd5e1">
    <circle cx="84" cy="162" r="5.5"/>
    <circle cx="102" cy="162" r="5.5"/>
    <circle cx="120" cy="162" r="5.5"/>
  </g>
  <text x="148" y="169" fill="#64748b" font-size="19" font-weight="600">Summer house · 12–18 August · Timeline</text>

  <!-- Occupancy and presence, the two chips above the grid. -->
  <rect x="84" y="208" width="196" height="32" rx="16" fill="#e6f6f4"/>
  <text x="182" y="230" fill="#0f766e" font-size="18" font-weight="600" text-anchor="middle">9 guests tonight</text>
  <rect x="950" y="208" width="166" height="32" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1033" y="230" fill="#55637a" font-size="18" font-weight="600" text-anchor="middle">3 people online</text>

  <!-- Day axis. Seven columns, 113px wide on a 116px step, from x=306. -->
  <g fill="#64748b" font-size="17" font-weight="600" text-anchor="middle">
    <text x="362" y="266">Tue 12</text>
    <text x="478" y="266">Wed 13</text>
    <text x="594" y="266">Thu 14</text>
    <text x="710" y="266">Fri 15</text>
    <text x="826" y="266">Sat 16</text>
    <text x="942" y="266">Sun 17</text>
    <text x="1058" y="266">Mon 18</text>
  </g>

  <!-- Guest names, each with its own colour dot. -->
  <g font-size="20" font-weight="600" fill="#0f172a">
    <circle cx="90" cy="296" r="6" fill="#c62828"/><text x="108" y="303">Aurélia</text>
    <circle cx="90" cy="338" r="6" fill="#1d4ed8"/><text x="108" y="345">Tom</text>
    <circle cx="90" cy="380" r="6" fill="#15803d"/><text x="108" y="387">Alice + Julie</text>
    <circle cx="90" cy="422" r="6" fill="#b45309"/><text x="108" y="429">Guillaume</text>
    <circle cx="90" cy="464" r="6" fill="#6d28d9"/><text x="108" y="471">Clémentine</text>
    <circle cx="90" cy="506" r="6" fill="#be185d"/><text x="108" y="513">Hippolyte</text>
  </g>

  <!-- Nights with no room, so the bars read against a calendar rather than
       floating in space. -->
  <g fill="#f1f5f9">
    <rect x="770" y="320" width="113" height="36" rx="6"/>
    <rect x="886" y="320" width="113" height="36" rx="6"/>
    <rect x="1002" y="320" width="113" height="36" rx="6"/>
    <rect x="306" y="362" width="113" height="36" rx="6"/>
    <rect x="306" y="404" width="113" height="36" rx="6"/>
    <rect x="422" y="404" width="113" height="36" rx="6"/>
    <rect x="886" y="404" width="113" height="36" rx="6"/>
    <rect x="1002" y="404" width="113" height="36" rx="6"/>
    <rect x="306" y="446" width="113" height="36" rx="6"/>
    <rect x="422" y="446" width="113" height="36" rx="6"/>
    <rect x="538" y="446" width="113" height="36" rx="6"/>
    <rect x="306" y="488" width="113" height="36" rx="6"/>
    <rect x="654" y="488" width="113" height="36" rx="6"/>
    <rect x="770" y="488" width="113" height="36" rx="6"/>
    <rect x="886" y="488" width="113" height="36" rx="6"/>
    <rect x="1002" y="488" width="113" height="36" rx="6"/>
  </g>

  <!-- Stays. One bar per guest, in that guest's own colour, labelled with the
       room and spanning the nights booked. -->
  <g font-size="18" font-weight="600" fill="#ffffff">
    <rect x="306" y="278" width="809" height="36" rx="6" fill="#c62828"/>
    <text x="320" y="302">Master bedroom</text>
    <rect x="306" y="320" width="461" height="36" rx="6" fill="#1d4ed8"/>
    <text x="320" y="344">Attic</text>
    <rect x="422" y="362" width="693" height="36" rx="6" fill="#15803d"/>
    <text x="436" y="386">Garden room · 2 people</text>
    <rect x="538" y="404" width="345" height="36" rx="6" fill="#b45309"/>
    <text x="552" y="428">Bunk room</text>
    <rect x="654" y="446" width="461" height="36" rx="6" fill="#6d28d9"/>
    <text x="668" y="470">Blue room</text>
    <rect x="422" y="488" width="229" height="36" rx="6" fill="#be185d"/>
    <text x="436" y="512">Sofa bed</text>
  </g>

  <!-- The pickup the trip still owes somebody: the other half of the headline. -->
  <line x1="84" y1="540" x2="1116" y2="540" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="6 5"/>
  <rect x="84" y="552" width="466" height="32" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="317" y="574" fill="#55637a" font-size="18" font-weight="600" text-anchor="middle">Thu 14 · 22:40 · Clémentine, TGV 8541 — Vannes</text>
  <rect x="566" y="552" width="148" height="32" rx="16" fill="#fdead9"/>
  <text x="640" y="574" fill="#9a4a05" font-size="18" font-weight="600" text-anchor="middle">Needs pickup</text>
</svg>
