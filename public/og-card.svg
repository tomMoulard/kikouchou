<!--
  Kikouchou link preview card - source for public/og-card.png

  This is what a pasted link to the app looks like in a chat window. It is the
  hero banner of www.kikouchou.app redrawn at the 1200x630 that every consumer
  of `og:image` is built around: Facebook, Slack, LinkedIn and iMessage all
  render a 1.91:1 card, and Twitter's `summary_large_image` crops to it.

  It follows the brand kit ("Soleil couchant") and the landing page rather
  than inventing a second look: Creme paper, Encre text, Prune accent, the
  horizontal logo lockup (outlined, so it needs no font), and the six
  `pN-label` guest colours from the app's palette. Someone who saw the site
  recognises the card.

  Rows are guests, columns are the seven days of the trip, and each bar is the
  room that guest sleeps in. The trip name, the guest names and the train are
  the landing page mockup's, verbatim: Summer house, Aurélia, Tom, Alice +
  Julie, Guillaume, Clémentine, Hippolyte. They are illustrative, and they must
  stay that way. A card served from the root page cannot know a trip, and it
  must not carry a real one: every link scanner that sees the URL fetches the
  card, and chat apps cache it. Real per-trip cards are a separate, deferred
  piece of work (see TODO.md).

  Fonts: the stack starts with DejaVu Sans because this file is rasterised by
  sharp on an Ubuntu runner, where DejaVu is present and `system-ui` resolves to
  nothing. Anything missing falls through to the generic sans-serif rather than
  rendering blank. Every string sits at a hand-measured coordinate, so a font
  substitution changes glyph widths and never the layout.

  Regenerate with `bun run generate-icons`.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     font-family="DejaVu Sans, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Applied to its own rect, never to the window, so a rasteriser without
         filter support loses the shadow and nothing else. -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#f6f0e4"/>

