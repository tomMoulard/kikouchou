<!--
  Kikouchou link preview card - source for public/og-card.png

  This is what a pasted link to the app looks like in a chat window. It is the
  landing page hero, redrawn at the 1200x630 that every consumer of `og:image`
  is built around: Facebook, Slack, LinkedIn and iMessage all render a 1.91:1
  card, and Twitter's `summary_large_image` crops to it.

  Rows are rooms, columns are the seven days of a trip, and each bar is one
  guest's stay in that room. The content is illustrative. A card served from the
  root page cannot know a trip, so it shows the shape of the product rather than
  anybody's real stay.

  Fonts: the stack starts with DejaVu Sans because this file is rasterised by
  sharp on an Ubuntu runner, where DejaVu is present and `system-ui` resolves to
  nothing. Anything missing falls through to the generic sans-serif rather than
  rendering blank.

  Regenerate with `bun run generate-icons`.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Ground: the same slate as `theme-color` in index.html, so an installed
       app and its share card agree. -->
  <rect width="1200" height="630" fill="#0f172a"/>

  <!-- Header -->
  <text x="56" y="112" fill="#f8fafc" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="62" font-weight="700">Kikouchou</text>
  <text x="56" y="162" fill="#94a3b8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="30" font-weight="400">Who sleeps where, and when</text>

  <!-- Day axis. Columns are 116.29px wide, from x=330 to x=1144. -->
  <g fill="#64748b" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="middle">
    <text x="388" y="238">Tue 12</text>
    <text x="504" y="238">Wed 13</text>
    <text x="621" y="238">Thu 14</text>
    <text x="737" y="238">Fri 15</text>
    <text x="853" y="238">Sat 16</text>
    <text x="969" y="238">Sun 17</text>
    <text x="1086" y="238">Mon 18</text>
  </g>

  <!-- One hairline per day, so the bars read against a calendar rather than
       floating in space. -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="330" y1="250" x2="330" y2="586"/>
    <line x1="446" y1="250" x2="446" y2="586"/>
    <line x1="563" y1="250" x2="563" y2="586"/>
    <line x1="679" y1="250" x2="679" y2="586"/>
    <line x1="795" y1="250" x2="795" y2="586"/>
    <line x1="911" y1="250" x2="911" y2="586"/>
    <line x1="1028" y1="250" x2="1028" y2="586"/>
    <line x1="1144" y1="250" x2="1144" y2="586"/>
  </g>

  <!-- Room labels. Names only: a card is fetched by every link scanner that
       sees the URL, so no guest names appear on it. -->
  <g fill="#cbd5e1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" font-weight="500">
    <text x="56" y="277">Master bedroom</text>
    <text x="56" y="335">Attic</text>
    <text x="56" y="393">Garden room</text>
    <text x="56" y="451">Bunk room</text>
    <text x="56" y="509">Blue room</text>
    <text x="56" y="567">Sofa bed</text>
  </g>

  <!-- Stays. Each bar is one guest, in that guest's own colour, spanning the
       nights booked. -->
  <g rx="7">
    <!-- Master bedroom: the whole week -->
    <rect x="333" y="252" width="808" height="36" rx="7" fill="#f43f5e"/>
    <!-- Attic: the whole week -->
    <rect x="333" y="310" width="808" height="36" rx="7" fill="#38bdf8"/>
    <!-- Garden room: two guests in turn, one leaving as the other arrives -->
    <rect x="333" y="368" width="343" height="36" rx="7" fill="#a78bfa"/>
    <rect x="682" y="368" width="459" height="36" rx="7" fill="#34d399"/>
    <!-- Bunk room: Wednesday to Sunday -->
    <rect x="449" y="426" width="575" height="36" rx="7" fill="#fbbf24"/>
    <!-- Blue room: Thursday onward -->
    <rect x="566" y="484" width="575" height="36" rx="7" fill="#60a5fa"/>
    <!-- Sofa bed: the weekend only -->
    <rect x="798" y="542" width="343" height="36" rx="7" fill="#f472b6"/>
  </g>

  <!-- Where the card came from, and the only thing on it that invites the
       reader in. -->
  <text x="1144" y="612" fill="#38bdf8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" text-anchor="end">app.kikouchou.app</text>
</svg>
