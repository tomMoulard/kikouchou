143.07 42.09Q141.6 42.09 140.56 42.84Q139.52 43.59 139 45.08Q138.47 46.57 138.47 48.73Q138.47 52.18 139.76 53.99Q141.06 55.81 143.39 55.81ZM164.87 60.59Q161.04 60.59 159.15 57.96Q157.25 55.32 157.25 49.92V37.66H163.75V49.39Q163.75 52.39 164.61 53.75Q165.48 55.12 167.23 55.12Q168.32 55.12 169.17 54.56Q170.01 54.01 170.62 52.96Q171.23 51.9 171.54 50.4Q171.86 48.9 171.87 46.98V37.66H178.35V50.44L178.35 60H173L173 52.29H172.39Q171.92 55.2 170.99 57.03Q170.05 58.87 168.55 59.73Q167.05 60.59 164.87 60.59ZM192.86 60.59Q189.94 60.59 187.78 59.73Q185.62 58.88 184.2 57.33Q182.77 55.77 182.07 53.68Q181.36 51.58 181.36 49.1Q181.36 46.54 182.07 44.37Q182.78 42.2 184.2 40.55Q185.61 38.89 187.74 37.98Q189.87 37.07 192.69 37.07Q195.77 37.07 197.85 38.14Q199.93 39.21 201.04 41.01Q202.15 42.82 202.28 45.07L196.44 46.43Q196.4 44.98 195.88 44.01Q195.37 43.05 194.48 42.59Q193.6 42.12 192.45 42.12Q191.36 42.12 190.52 42.54Q189.68 42.96 189.1 43.81Q188.52 44.67 188.21 45.91Q187.9 47.15 187.9 48.81Q187.9 51.06 188.47 52.61Q189.03 54.17 190.16 54.97Q191.28 55.78 192.94 55.78Q194.59 55.78 195.51 55.06Q196.43 54.35 196.82 53.26Q197.21 52.17 197.21 51.06L202.99 51.92Q202.99 53.64 202.4 55.21Q201.81 56.78 200.57 57.99Q199.33 59.21 197.42 59.9Q195.52 60.59 192.86 60.59ZM205.39 60V46.94L205.39 29.92H211.88V36.33Q211.88 37.19 211.8 38.33Q211.71 39.48 211.55 40.72Q211.39 41.96 211.22 43.17Q211.06 44.37 210.89 45.38H211.61Q212.12 42.65 213.04 40.81Q213.96 38.96 215.48 38.01Q217.01 37.07 219.26 37.07Q223.06 37.07 224.93 39.75Q226.79 42.43 226.79 47.92V60H220.29V48.64Q220.29 45.54 219.41 44.05Q218.54 42.56 216.7 42.56Q215.16 42.56 214.1 43.57Q213.03 44.57 212.46 46.45Q211.89 48.32 211.87 50.94V60H205.39ZM240.78 60.59Q237.47 60.59 234.92 59.28Q232.38 57.97 230.94 55.35Q229.51 52.74 229.51 48.82Q229.51 44.82 230.97 42.22Q232.44 39.62 235 38.35Q237.56 37.07 240.81 37.07Q244.15 37.07 246.7 38.38Q249.24 39.69 250.67 42.29Q252.11 44.9 252.11 48.84Q252.11 52.88 250.62 55.49Q249.14 58.1 246.57 59.34Q244 60.59 240.78 60.59ZM240.96 55.81Q242.47 55.81 243.49 55.07Q244.52 54.32 245.05 52.83Q245.57 51.34 245.57 49.21Q245.57 46.94 245.01 45.36Q244.44 43.79 243.35 42.94Q242.26 42.09 240.64 42.09Q239.17 42.09 238.14 42.84Q237.1 43.59 236.57 45.08Q236.04 46.57 236.04 48.73Q236.04 52.18 237.34 53.99Q238.63 55.81 240.96 55.81ZM262.45 60.59Q258.62 60.59 256.72 57.96Q254.82 55.32 254.82 49.92V37.66H261.33V49.39Q261.33 52.39 262.19 53.75Q263.05 55.12 264.8 55.12Q265.9 55.12 266.74 54.56Q267.59 54.01 268.2 52.96Q268.8 51.9 269.12 50.4Q269.43 48.9 269.45 46.98V37.66H275.92V50.44L275.93 60H270.58L270.57 52.29H269.97Q269.5 55.2 268.56 57.03Q267.63 58.87 266.13 59.73Q264.63 60.59 262.45 60.59Z" fill="#2A1D36"/></g>
  <text x="1144" y="62" fill="#7a3786" font-size="22" font-weight="600" text-anchor="end">app.kikouchou.app</text>
  <!-- `dx` rather than a trailing space: a rasteriser collapses the space at a
       tspan boundary and the two clauses run together. -->
  <text x="56" y="104" font-size="28"><tspan fill="#554a5e">Who sleeps where, and</tspan><tspan dx="9" fill="#7a3786" font-weight="700">who picks up whom.</tspan></text>

  <!-- The app window, as the hero shows it. -->
  <rect x="76" y="158" width="1048" height="448" rx="24" fill="#2a1d36" fill-opacity="0.16" filter="url(#cardShadow)"/>
  <rect x="56" y="136" width="1088" height="458" rx="20" fill="#fffcf5" stroke="#e3d7c2" stroke-width="1"/>

  <!-- Title bar. The second rect squares off the bottom corners the first one
       rounded, so only the top of the window is round. -->
  <rect x="57" y="137" width="1086" height="51" rx="19" fill="#f4ede0"/>
  <rect x="57" y="166" width="1086" height="22" fill="#f4ede0"/>
  <line x1="56" y1="188" x2="1144" y2="188" stroke="#e3d7c2" stroke-width="1"/>
  <g fill="#cdbd9f">
    <circle cx="84" cy="162" r="5.5"/>
    <circle cx="102" cy="162" r="5.5"/>
    <circle cx="120" cy="162" r="5.5"/>
  </g>
  <text x="148" y="169" fill="#645a6b" font-size="19" font-weight="600">Summer house · 12–18 August · Timeline</text>

  <!-- Occupancy and presence, the two chips above the grid. -->
  <rect x="84" y="208" width="196" height="32" rx="16" fill="#f0e4ee"/>
  <text x="182" y="230" fill="#7a3786" font-size="18" font-weight="600" text-anchor="middle">9 guests tonight</text>
  <rect x="950" y="208" width="166" height="32" rx="16" fill="#f4ede0" stroke="#e3d7c2" stroke-width="1"/>
  <text x="1033" y="230" fill="#554a5e" font-size="18" font-weight="600" text-anchor="middle">3 people online</text>

  <!-- Day axis. Seven columns, 113px wide on a 116px step, from x=306. -->
  <g fill="#645a6b" font-size="17" font-weight="600" text-anchor="middle">
    <text x="362" y="266">Tue 12</text>
    <text x="478" y="266">Wed 13</text>
    <text x="594" y="266">Thu 14</text>
    <text x="710" y="266">Fri 15</text>
    <text x="826" y="266">Sat 16</text>
    <text x="942" y="266">Sun 17</text>
    <text x="1058" y="266">Mon 18</text>
  </g>

  <!-- Guest names, each with its own colour dot. -->
  <g font-size="20" font-weight="600" fill="#2a1d36">
    <circle cx="90" cy="296" r="6" fill="#c62828"/><text x="108" y="303">Aurélia</text>
    <circle cx="90" cy="338" r="6" fill="#1d4ed8"/><text x="108" y="345">Tom</text>
    <circle cx="90" cy="380" r="6" fill="#15803d"/><text x="108" y="387">Alice + Julie</text>
    <circle cx="90" cy="422" r="6" fill="#b45309"/><text x="108" y="429">Guillaume</text>
    <circle cx="90" cy="464" r="6" fill="#6d28d9"/><text x="108" y="471">Clémentine</text>
    <circle cx="90" cy="506" r="6" fill="#be185d"/><text x="108" y="513">Hippolyte</text>
  </g>

  <!-- Nights with no room, so the bars read against a calendar rather than
       floating in space. -->
  <g fill="#efe6d4">
    <rect x="770" y="320" width="113" height="36" rx="6"/>
    <rect x="886" y="320" width="113" height="36" rx="6"/>
    <rect x="1002" y="320" width="113" height="36" rx="6"/>
    <rect x="306" y="362" width="113" height="36" rx="6"/>
    <rect x="306" y="404" width="113" height="36" rx="6"/>
    <rect x="422" y="404" width="113" height="36" rx="6"/>
    <rect x="886" y="404" width="113" height="36" rx="6"/>
    <rect x="1002" y="404" width="113" height="36" rx="6"/>
    <rect x="306" y="446" width="113" height="36" rx="6"/>
    <rect x="422" y="446" width="113" height="36" rx="6"/>
    <rect x="538" y="446" width="113" height="36" rx="6"/>
    <rect x="306" y="488" width="113" height="36" rx="6"/>
    <rect x="654" y="488" width="113" height="36" rx="6"/>
    <rect x="770" y="488" width="113" height="36" rx="6"/>
    <rect x="886" y="488" width="113" height="36" rx="6"/>
    <rect x="1002" y="488" width="113" height="36" rx="6"/>
  </g>

  <!-- Stays. One bar per guest, in that guest's own colour, labelled with the
       room and spanning the nights booked. -->
  <g font-size="18" font-weight="600" fill="#ffffff">
    <rect x="306" y="278" width="809" height="36" rx="6" fill="#c62828"/>
    <text x="320" y="302">Master bedroom</text>
    <rect x="306" y="320" width="461" height="36" rx="6" fill="#1d4ed8"/>
    <text x="320" y="344">Attic</text>
    <rect x="422" y="362" width="693" height="36" rx="6" fill="#15803d"/>
    <text x="436" y="386">Garden room · 2 people</text>
    <rect x="538" y="404" width="345" height="36" rx="6" fill="#b45309"/>
    <text x="552" y="428">Bunk room</text>
    <rect x="654" y="446" width="461" height="36" rx="6" fill="#6d28d9"/>
    <text x="668" y="470">Blue room</text>
    <rect x="422" y="488" width="229" height="36" rx="6" fill="#be185d"/>
    <text x="436" y="512">Sofa bed</text>
  </g>

  <!-- The pickup the trip still owes somebody: the other half of the headline. -->
  <line x1="84" y1="540" x2="1116" y2="540" stroke="#e3d7c2" stroke-width="1" stroke-dasharray="6 5"/>
  <rect x="84" y="552" width="466" height="32" rx="16" fill="#f4ede0" stroke="#e3d7c2" stroke-width="1"/>
  <text x="317" y="574" fill="#554a5e" font-size="18" font-weight="600" text-anchor="middle">Thu 14 · 22:40 · Clémentine, TGV 8541 — Vannes</text>
  <rect x="566" y="552" width="148" height="32" rx="16" fill="#fdead9"/>
  <text x="640" y="574" fill="#9a4a05" font-size="18" font-weight="600" text-anchor="middle">Needs pickup</text>
</svg>
