# The F-Droid build recipe, in fdroiddata's format.
#
# f-droid.org builds every app from source on its own servers. This file is
# what gets submitted to https://gitlab.com/fdroid/fdroiddata as
# metadata/app.kikouchou.yml, and what scripts/build-fdroid-repo.sh copies
# into the self-hosted repository at https://app.kikouchou.app/fdroid/repo.
#
# The `fdroid` flavor is the Play app without Firebase Cloud Messaging, which
# is not free software (capacitor.config.ts, android/app/build.gradle). It has
# no trip reminders; everything else is the same app.
#
# f-droid.org accepts free software only. The project is MIT (LICENSE).

# fdroiddata's own list (config/categories.yml in fdroiddata); `fdroid lint`
# refused the generic Time and Internet.
Categories:
  - Calendar & Agenda
  - Schedule
License: MIT
AuthorName: Tom Moulard
WebSite: https://www.kikouchou.app
SourceCode: https://github.com/tomMoulard/kikouchou
IssueTracker: https://github.com/tomMoulard/kikouchou/issues
Changelog: https://github.com/tomMoulard/kikouchou/releases

AutoName: Kikouchou

# PostHog product analytics run in the app (src/lib/posthog.ts). They are
# first-party and never shared with advertisers, but F-Droid asks for the flag
# on any reporting of usage.
AntiFeatures:
  NonFreeNet:
    en-US: The assistant sends questions through the project's server to OpenRouter, a non-free service.
  Tracking:
    en-US: Reports how the app is used to the project's own PostHog analytics.

RepoType: git
Repo: https://github.com/tomMoulard/kikouchou.git

Builds:
  - versionName: 0.1.9
    versionCode: 1009
    commit: v0.1.9
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
      - npm install -g bun
    init:
      - cd ../..
      - bun install --frozen-lockfile
    prebuild:
      - cd ../..
      - bun run build
      # On Bun's runtime: the Capacitor CLI requires Node 22, and the build
      # server has Debian's Node 20.
      - KIKOUCHOU_ANDROID_FLAVOR=fdroid bunx --bun cap sync android
    scandelete:
      - node_modules
    gradle:
      - fdroid
    # The Gradle files read the flavor from this property, so Google's
    # services plugin never lands on the classpath. fdroidserver has no
    # flag for an environment variable: `env:` stopped `fdroid update`.
    gradleprops:
      - kikouchouAndroidFlavor=fdroid

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
# The version code is computed in Gradle, which a regex cannot read, so
# package.json states it too (android/app/build.gradle checks they agree).
UpdateCheckData: package.json|"versionCode":\s*(\d+)|.|"version":\s*"([^"]+)"
CurrentVersion: 0.1.9
CurrentVersionCode: 1009
